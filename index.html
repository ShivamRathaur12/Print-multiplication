<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Multiplication Table</title>
    <script src="app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background: white;
            padding: 20px 30px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            text-align: center;
        }
        input {
            padding: 8px;
            width: 150px;
            margin-bottom: 10px;
        }
        button {
            padding: 8px 15px;
            cursor: pointer;
        }
        .result {
            margin-top: 15px;
            text-align: left;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Multiplication Table</h2>
    <input type="number" id="number" placeholder="Enter a number">
    <br>
    <button onclick="printTable()">Print Table</button>

    <div class="result" id="output"></div>
</div>

</body>
</html>
